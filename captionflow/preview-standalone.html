<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CaptionFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>:root{--bg:#1e1e1e;--panel:#262626;--panel2:#2f2f2f;--line:#3a3a3a;--text:#e6e6e6;--muted:#9a9a9a;--accent:#4f8cff;--accent2:#2d6be0;--ok:#35c27c;--warn:#f0a030;--bad:#ef5350}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:12px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.on{background:var(--ok)}
#ctxInfo{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-left:4px}
#previewBox{padding:8px 10px;border-bottom:1px solid var(--line);background:#161616}
#cv{width:100%;aspect-ratio:16/9;display:block;background:repeating-conic-gradient(#2a2a2a 0 25%,#232323 0 50%) 0 0/16px 16px;border-radius:4px}
.transport{display:flex;align-items:center;gap:8px;margin:6px 0}
.transport input{flex:1}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:#5a5a5a}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent2);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent}
button.small{padding:3px 8px;font-size:11px}
button.icon{width:30px;padding:4px 0}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row.wrap{flex-wrap:wrap}.row.tight{margin:2px 0}
.row .primary{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
label{display:block;color:var(--muted);font-size:11px;margin:6px 0}
label input[type=text],label input[type=password],label input[type=number],label select,select,textarea{width:100%;margin-top:3px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:5px 6px;font:inherit}
label input[type=range]{width:100%;margin-top:4px}
label input[type=color]{width:100%;height:26px;padding:0;margin-top:3px;background:var(--panel);border:1px solid var(--line)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--text);margin:4px 0}
label.chk input{margin:0}
nav#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
nav#tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);padding:8px 2px;font-size:11px;border-bottom:2px solid transparent}
nav#tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
main{flex:1;padding:6px 10px 10px}
.pane{display:none}.pane.on{display:block}
.hidden{display:none!important}
details{margin:6px 0}summary{cursor:pointer;color:var(--muted)}
#wave{width:100%;height:70px;background:#161616;border-radius:4px;display:block}
.hint{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--muted);margin:6px 0;font-size:11px}
.block{display:grid;grid-template-columns:62px 1fr;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px;margin:6px 0}
.block.sel{border-color:var(--accent)}
.block.warn .meta .wps{color:var(--warn)}
.block .meta{font-size:10px;color:var(--muted);line-height:1.5}
.block textarea{width:100%;margin:0;resize:none;min-height:38px;overflow:hidden}
.sect{margin:10px 0 2px;color:var(--text);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
#log{padding:6px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;min-height:28px;white-space:pre-wrap}
#log.err{color:var(--bad)}#log.ok{color:var(--ok)}
.ver{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot" id="hostDot" title="Conexao com o Premiere"></span>CaptionFlow</div>
    <div id="ctxInfo" class="muted">Sem contexto</div>
    <span id="ver" class="ver" title="Versao instalada"></span>
    <button id="btnCtx" class="ghost" title="Ler sequencia e clip selecionado">Atualizar</button>
  </header>

  <section id="previewBox">
    <canvas id="cv" width="960" height="540"></canvas>
    <div class="transport">
      <button id="btnPlay" class="icon" title="Reproduzir preview (Espaco)">&#9654;</button>
      <input id="seek" type="range" min="0" max="100" step="0.01" value="0">
      <span id="tcode" class="mono">00:00.00</span>
    </div>
    <div class="row wrap tight">
      <label class="chk"><input type="checkbox" id="syncHead"> Seguir playhead do Premiere</label>
      <button id="btnFrame" class="ghost small" title="Usa o frame atual da sequencia como fundo do preview">Frame de fundo</button>
      <button id="btnNoBg" class="ghost small">Limpar fundo</button>
    </div>
  </section>

  <nav id="tabs">
    <button data-tab="trans" class="on">1 Transcrever</button>
    <button data-tab="cut">2 Cortes</button>
    <button data-tab="cap">3 Legendas</button>
    <button data-tab="style">4 Estilo</button>
    <button data-tab="apply">5 Aplicar</button>
  </nav>

  <main>
    <div class="pane on" id="tab-trans">
      <div class="grid2">
        <label>Motor
          <select id="provider"><option value="openai">OpenAI Whisper (API)</option><option value="local">whisper.cpp (local)</option></select>
        </label>
        <label>Idioma
          <select id="language"><option value="pt">Portugues</option><option value="en">Ingles</option><option value="es">Espanhol</option><option value="auto">Automatico</option></select>
        </label>
      </div>
      <div id="openaiBox">
        <label>Chave da API OpenAI <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off"></label>
      </div>
      <div id="localBox" class="hidden">
        <label>Executavel whisper.cpp (whisper-cli) <input type="text" id="whisperBin" placeholder="/usr/local/bin/whisper-cli"></label>
        <label>Modelo (.bin) <input type="text" id="whisperModel" placeholder="ggml-small.bin"></label>
      </div>
      <details>
        <summary>Opcoes avancadas</summary>
        <label>Caminho do ffmpeg <input type="text" id="ffmpegPath" placeholder="vazio = automatico / PATH"></label>
        <label>Vocabulario / dica de contexto (opcional) <input type="text" id="whisperPrompt" placeholder="nomes proprios, termos tecnicos"></label>
        <label>Tamanho do trecho enviado (s) <input type="number" id="chunkSec" min="60" max="1200" value="600"></label>
      </details>
      <div class="row">
        <button id="btnTranscribe" class="primary">Transcrever clip selecionado</button>
      </div>
      <div class="row wrap">
        <button id="btnDemo" class="ghost small">Carregar demo</button>
        <button id="btnImportJson" class="ghost small">Importar JSON</button>
        <button id="btnExportJson" class="ghost small">Exportar JSON</button>
        <input type="file" id="fileJson" accept=".json" class="hidden">
      </div>
      <div id="transStat" class="muted"></div>
    </div>

    <div class="pane" id="tab-cut">
      <canvas id="wave" width="800" height="90"></canvas>
      <div class="grid2">
        <label>Limiar (dB) <span id="vThr" class="mono"></span><input type="range" id="thr" min="-70" max="-15" step="1" value="-40"></label>
        <label>Silencio minimo (s) <span id="vMin" class="mono"></span><input type="range" id="minSil" min="0.1" max="2" step="0.05" value="0.4"></label>
        <label>Padding (s) <span id="vPad" class="mono"></span><input type="range" id="pad" min="0" max="0.5" step="0.01" value="0.1"></label>
        <label>Estilo de transicao
          <select id="jlMode"><option value="none">Corte seco</option><option value="j">J-cut</option><option value="l">L-cut</option><option value="alt">J e L alternados</option><option value="both">J + L em todos</option></select>
        </label>
        <label>Antecipacao J (s) <span id="vLead" class="mono"></span><input type="range" id="lead" min="0.05" max="1" step="0.01" value="0.25"></label>
        <label>Extensao L (s) <span id="vTail" class="mono"></span><input type="range" id="tail" min="0.05" max="1" step="0.01" value="0.25"></label>
      </div>
      <label class="chk"><input type="checkbox" id="protect" checked> Proteger palavras transcritas (nao cortar dentro de fala)</label>
      <label class="chk"><input type="checkbox" id="followCut" checked> Reajustar legendas ao aplicar o corte</label>
      <div class="row">
        <button id="btnAnalyze" class="primary">Analisar audio</button>
        <button id="btnApplyCut" disabled>Aplicar rough cut</button>
      </div>
      <div id="cutStat" class="muted"></div>
    </div>

    <div class="pane" id="tab-cap">
      <div class="grid2">
        <label>Max. caracteres por linha <span id="vChars" class="mono"></span><input type="range" id="maxChars" min="12" max="60" step="1" value="32"></label>
        <label>Linhas por bloco
          <select id="maxLines"><option>1</option><option selected>2</option><option>3</option></select>
        </label>
        <label>Palavras por segundo (max) <span id="vWps" class="mono"></span><input type="range" id="maxWps" min="1.5" max="7" step="0.1" value="3.5"></label>
        <label>Pausa que separa blocos (s) <span id="vPause" class="mono"></span><input type="range" id="pause" min="0.2" max="2" step="0.05" value="0.6"></label>
      </div>
      <div class="row wrap">
        <button id="btnRebuild" class="ghost small">Refazer blocos</button>
        <button id="btnExportSrt" class="ghost small">Exportar SRT</button>
        <span class="muted" id="capStat"></span>
      </div>
      <div class="hint">
        <b>Atalhos no bloco:</b> Alt+&rarr; envia a ultima palavra ao proximo bloco, Alt+&larr; envia a primeira ao bloco anterior.
        Com Shift traz a palavra do vizinho. Enter divide no cursor, Backspace no inicio une com o anterior, Shift+Enter forca quebra de linha.
      </div>
      <div id="blocks"></div>
    </div>

    <div class="pane" id="tab-style">
      <div class="row">
        <select id="presetSel"></select>
        <button id="btnPresetSave" class="small">Salvar como...</button>
        <button id="btnPresetDel" class="ghost small">Excluir</button>
      </div>
      <div class="row wrap">
        <button id="btnPresetExport" class="ghost small">Exportar presets</button>
        <button id="btnPresetImport" class="ghost small">Importar presets</button>
        <input type="file" id="filePresets" accept=".json" class="hidden">
      </div>
      <div id="styleForm"></div>
    </div>

    <div class="pane" id="tab-apply">
      <label>Metodo de insercao
        <select id="applyMode">
          <option value="raster">Camadas gráficas com keyframes (PNG animado)</option>
          <option value="mogrt">Essential Graphics (MOGRT)</option>
          <option value="srt">Faixa de legendas nativa (SRT)</option>
        </select>
      </label>
      <div id="mogrtBox" class="hidden">
        <label>Arquivo .mogrt <input type="text" id="mogrtPath" placeholder="C:\\caminho\\template.mogrt"></label>
        <label>Nome do parametro de texto <input type="text" id="mogrtParam" placeholder="Source Text (vazio = automatico)"></label>
      </div>
      <div class="grid2">
        <label>Trilha de video (V) <input type="number" id="vTrack" min="1" max="20" value="2"></label>
        <label>Origem do tempo
          <select id="baseMode"><option value="clip">Inicio do clip selecionado</option><option value="zero">Inicio da sequencia</option><option value="playhead">Playhead atual</option></select>
        </label>
      </div>
      <div class="row"><button id="btnApply" class="primary">Inserir na timeline</button></div>
      <div class="muted" id="applyStat"></div>
    </div>
  </main>

  <footer><div id="log"></div></footer>
</div>

<script>(function (root) {
  var CF = (root.CF = root.CF || {});
  var U = CF.util || (typeof require !== 'undefined' ? require('./util.js') : null);

  var STOP = {};
  ('a o as os um uma de da do das dos em na no nas nos e ou que com por para pra se ' +
    'an the of to in on at and or but for with by el la los las un una del y').split(' ')
    .forEach(function (w) { STOP[w] = 1; });
  function isStop(t) { return !!STOP[t.toLowerCase().replace(/[^\p{L}]/gu, '')]; }

  var DEFAULTS = {
    maxChars: 32,      // caracteres por linha
    maxLines: 2,
    maxWps: 3.5,       // palavras por segundo (velocidade de leitura)
    minDuration: 0.8,
    maxDuration: 5,
    pauseBreak: 0.6,   // pausa entre palavras que fecha o bloco
    holdGap: 0.04      // folga ate o proximo bloco
  };

  function lineLen(words, i, j) {
    var n = 0;
    for (var k = i; k < j; k++) n += words[k].text.length;
    return n + Math.max(0, j - i - 1);
  }

  // Quebra balanceada em K linhas por programacao dinamica.
  function fitSegment(words, maxChars, maxLines) {
    var n = words.length;
    if (!n) return [];
    var total = lineLen(words, 0, n);
    for (var K = 1; K <= maxLines; K++) {
      if (K === 1) { if (total <= maxChars || n === 1) return [[0, n]]; continue; }
      if (n < K) break;
      var target = total / K, INF = 1e9, cost = [], prev = [], k, i, j;
      for (k = 0; k <= K; k++) {
        cost.push([]); prev.push([]);
        for (i = 0; i <= n; i++) { cost[k].push(INF); prev[k].push(-1); }
      }
      cost[0][0] = 0;
      for (k = 1; k <= K; k++) {
        for (i = k; i <= n; i++) {
          for (j = k - 1; j < i; j++) {
            if (cost[k - 1][j] >= INF) continue;
            var len = lineLen(words, j, i);
            if (len > maxChars && i - j > 1) continue;
            var c = Math.pow(len - target, 2), last = words[i - 1].text;
            if (i < n) {
              if (/[.,;:!?…]$/.test(last)) c -= 6;
              else if (isStop(last)) c += 8;
            }
            var tot = cost[k - 1][j] + c;
            if (tot < cost[k][i]) { cost[k][i] = tot; prev[k][i] = j; }
          }
        }
      }
      if (cost[K][n] < INF) {
        var out = [], e = n;
        for (k = K; k >= 1; k--) { var s = prev[k][e]; out.unshift([s, e]); e = s; }

  // Retorna lista de [inicio, fim) em indices de palavra, ou null se nao couber.
  function fitLines(words, maxChars, maxLines) {
    var hasBr = words.some(function (w) { return w.br; });
    if (!hasBr) return fitSegment(words, maxChars, maxLines);
    var lines = [], start = 0;
    for (var i = 0; i < words.length; i++) {
      if (words[i].br || i === words.length - 1) {
        var seg = fitSegment(words.slice(start, i + 1), maxChars, maxLines);
        if (!seg) return null;
        seg.forEach(function (r) { lines.push([r[0] + start, r[1] + start]); });
        start = i + 1;
      }
    }
    return lines.length <= maxLines ? lines : null;

  function linesText(block, o) {
    o = o || DEFAULTS;
    var ls = fitLines(block.words, o.maxChars, o.maxLines) || [[0, block.words.length]];

    });

    return (raw || []).map(function (w) {
      return { text: String(w.text != null ? w.text : w.word).trim(), start: +w.start, end: +w.end };

    function close() { if (cur.length) { blocks.push(mk(cur)); cur = []; } }

    var o = Object.assign({}, DEFAULTS, opts || {});

    for (var i = blocks.length - 1; i >= 0; i--) if (!blocks[i].words.length) blocks.splice(i, 1);

  function sendLastWordForward(blocks, i) {
    var b = blocks[i]; if (!b || !b.words.length) return blocks;

  }
  function sendFirstWordBack(blocks, i) {
    var b = blocks[i]; if (!b || !b.words.length) return blocks;
    var w = b.words.shift();
    if (blocks[i - 1]) { delete blocks[i - 1].words[blocks[i - 1].words.length - 1].br; blocks[i - 1].words.push(w); }

  }
  function pullFirstWordFromNext(blocks, i) {

    blocks[i].words.push(n.words.shift());

  }
  function pullLastWordFromPrev(blocks, i) {
    var p = blocks[i - 1]; if (!p || !blocks[i]) return blocks;
    var w = p.words.pop(); delete w.br;

    dropEmpty(blocks); return blocks;
  }
  function splitBlock(blocks, i, at) {
    var b = blocks[i]; if (!b || at <= 0 || at >= b.words.length) return blocks;

      var d = document.createElement('div'); d.className = 'block' + (i === st.sel ? ' sel' : '') + (b.warn ? ' warn' : ''); d.dataset.i = i;
      var wps = b.words.length / Math.max(b.showEnd - b.start, 0.01);
      d.innerHTML = '<div class="meta">#' + (i + 1) + '<br>' + U.fmt(b.start) + '<br><span class="wps">' + wps.toFixed(1) + ' p/s</span></div>';
      var ta = document.createElement('textarea'); ta.value = blocksText(b); ta.rows = Math.max(2, ta.value.split('\n').length); ta.spellcheck = false;
      ta.onfocus = function () { selectBlock(i, false); };
      ta.oninput = function () {
        C.setBlockText(b, ta.value); C.finalizeTiming(st.blocks, layout()); draw();
        var m = d.querySelector('.meta'); m.innerHTML = '#' + (i + 1) + '<br>' + U.fmt(b.start) + '<br><span class="wps">' + (b.words.length / Math.max(b.showEnd - b.start, 0.01)).toFixed(1) + ' p/s</span>';
        d.classList.toggle('warn', !!b.warn);
      };
      ta.onkeydown = function (e) { keyHandler(e, i, ta); };
      d.appendChild(ta); box.appendChild(d);
    });
    $('capStat').textContent = st.blocks.length + ' blocos, ' + st.words.length + ' palavras';
  }
  function selectBlock(i, scroll) {
    st.sel = i; var b = st.blocks[i]; if (!b) return;
    document.querySelectorAll('.block').forEach(function (d, k) { d.classList.toggle('sel', k === i); });
    st.t = b.start + 0.02; updateSeek(); draw();
  }
  function focusBlock(i, end) {
    var tas = document.querySelectorAll('.block textarea'), ta = tas[Math.max(0, Math.min(i, tas.length - 1))];
    if (ta) { ta.focus(); if (end != null) ta.setSelectionRange(end, end); }
  }
  function mutate(fn, focusIdx) {
    fn(st.blocks); C.finalizeTiming(st.blocks, layout());
    st.words = [].concat.apply([], st.blocks.map(function (b) { return b.words; }));
    st.sel = Math.max(0, Math.min(focusIdx, st.blocks.length - 1));
    renderBlocks(); focusBlock(st.sel); selectBlock(st.sel);
  }
  function keyHandler(e, i, ta) {
    var alt = e.altKey, sh = e.shiftKey;
    if (alt && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      e.preventDefault();
      if (e.key === 'ArrowRight') mutate(function (b) { sh ? C.pullFirstWordFromNext(b, i) : C.sendLastWordForward(b, i); }, i);
      else mutate(function (b) { sh ? C.pullLastWordFromPrev(b, i) : C.sendFirstWordBack(b, i); }, sh ? i : Math.max(0, i - (st.blocks[i] && st.blocks[i].words.length === 1 ? 1 : 0)));
    } else if (alt && e.key === 'ArrowDown') { e.preventDefault(); focusBlock(i + 1); }
    else if (alt && e.key === 'ArrowUp') { e.preventDefault(); focusBlock(i - 1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      var pos = ta.selectionStart, before = ta.value.slice(0, pos).split(/\s+/).filter(Boolean).length;
      if (sh) {
        var b = st.blocks[i]; if (before > 0 && before < b.words.length) { b.words[before - 1].br = !b.words[before - 1].br; renderBlocks(); focusBlock(i, pos); draw(); }
      } else mutate(function (bl) { C.splitBlock(bl, i, before); }, i + 1);
    } else if (e.key === 'Backspace' && ta.selectionStart === 0 && ta.selectionEnd === 0 && i > 0) {
      e.preventDefault(); mutate(function (bl) { C.mergeWithNext(bl, i - 1); }, i - 1);
    }
  }
  $('btnRebuild').onclick = function () { setWords(st.words); };
  $('btnExportSrt').onclick = function () { download('legendas.srt', C.toSRT(st.blocks, layout())); };

  // ---------- estilo ----------
  var FIELDS = [
    ['Tipografia'],
    ['family', 'Fonte (CSS font-family)', 'text'], ['weight', 'Peso', 'select', [300, 400, 500, 600, 700, 800, 900]], ['size', 'Tamanho (px a 1080p)', 'range', 20, 160, 1],
    ['uppercase', 'Caixa alta', 'check'], ['italic', 'Italico', 'check'], ['align', 'Alinhamento', 'select', ['left', 'center', 'right']], ['lineHeight', 'Entrelinha', 'range', 0.9, 1.6, 0.01],
    ['Posicao e cor'],
    ['x', 'Posicao X', 'range', 0, 1, 0.005], ['y', 'Posicao Y', 'range', 0, 1, 0.005], ['fill', 'Cor de preenchimento', 'color'],
    ['Traco e sombra'],
    ['stroke.width', 'Espessura do traco', 'range', 0, 20, 0.5], ['stroke.color', 'Cor do traco', 'color'],
    ['shadow.enabled', 'Sombra', 'check'], ['shadow.color', 'Cor da sombra', 'color'], ['shadow.alpha', 'Opacidade da sombra', 'range', 0, 1, 0.01],
    ['shadow.blur', 'Desfoque', 'range', 0, 40, 1], ['shadow.y', 'Deslocamento Y', 'range', -20, 20, 1],
    ['Caixa de fundo'],
    ['bg.enabled', 'Caixa atras do texto', 'check'], ['bg.color', 'Cor da caixa', 'color'], ['bg.alpha', 'Opacidade', 'range', 0, 1, 0.01], ['bg.padding', 'Margem interna', 'range', 0, 60, 1], ['bg.radius', 'Raio', 'range', 0, 40, 1],
    ['Animacao'],
    ['anim.entry', 'Entrada', 'select', CF.anim.ENTRIES], ['anim.exit', 'Saida', 'select', CF.anim.EXITS],
    ['anim.inDur', 'Duracao da entrada (s)', 'range', 0.05, 1, 0.01], ['anim.outDur', 'Duracao da saida (s)', 'range', 0.05, 1, 0.01],
    ['Destaque da palavra ativa'],
    ['highlight.mode', 'Modo', 'select', CF.anim.HIGHLIGHTS], ['highlight.color', 'Cor do destaque', 'color'], ['highlight.boxColor', 'Cor da caixa (modo caixa)', 'color'], ['highlight.scale', 'Escala (modo escala)', 'range', 1, 1.6, 0.01]
  ];
  function buildForm() {
    var f = $('styleForm'); f.innerHTML = '';
    var grid = null;
    FIELDS.forEach(function (fd) {
      if (fd.length === 1) { var h = document.createElement('div'); h.className = 'sect'; h.textContent = fd[0]; f.appendChild(h); grid = document.createElement('div'); grid.className = 'grid2'; f.appendChild(grid); return; }
      var key = fd[0], val = U.getPath(st.preset, key), lab = document.createElement('label'), inp;
      if (fd[2] === 'check') { lab.className = 'chk'; inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!val; lab.appendChild(inp); lab.appendChild(document.createTextNode(fd[1])); }
      else {
        lab.appendChild(document.createTextNode(fd[1]));
        if (fd[2] === 'select') { inp = document.createElement('select'); fd[3].forEach(function (o) { var op = document.createElement('option'); op.value = o; op.textContent = o; inp.appendChild(op); }); inp.value = val; }
        else { inp = document.createElement('input'); inp.type = fd[2]; if (fd[2] === 'range') { inp.min = fd[3]; inp.max = fd[4]; inp.step = fd[5]; } inp.value = val; }
        lab.appendChild(inp);
      }
      inp.addEventListener('input', function () {
        var v = fd[2] === 'check' ? inp.checked : fd[2] === 'range' ? +inp.value : (fd[2] === 'select' && /^\d+$/.test(inp.value) ? +inp.value : inp.value);
        U.setPath(st.preset, key, v); draw();
      });
      (grid || f).appendChild(lab);
    });
  }
  function fillPresetSel() {
    var sel = $('presetSel'); sel.innerHTML = '';
    P.all().forEach(function (p) { var o = document.createElement('option'); o.value = p.id; o.textContent = (p.builtin ? '' : '* ') + p.name; sel.appendChild(o); });
    sel.value = st.preset.id;
  }
  $('presetSel').onchange = function () { st.preset = P.get(this.value); settings.presetId = st.preset.id; saveSettings(); buildForm(); draw(); };
  $('btnPresetSave').onclick = function () {
    var name = window.prompt ? window.prompt('Nome do preset:', st.preset.builtin ? st.preset.name + ' (copia)' : st.preset.name) : null;
    if (!name) return;
    var p = U.clone(st.preset); p.name = name; p.id = 'user-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString(36); delete p.builtin;
    P.saveCustom(p); st.preset = P.get(p.id); settings.presetId = p.id; saveSettings(); fillPresetSel(); log('Preset salvo.', 'ok');
  };
  $('btnPresetDel').onclick = function () {
    if (st.preset.builtin) return log('Presets padrao nao podem ser excluidos.', 'err');
    P.remove(st.preset.id); st.preset = P.get('clean'); fillPresetSel(); buildForm(); draw();
  };
  $('btnPresetExport').onclick = function () { download('presets-captionflow.json', P.exportJSON()); };
  $('btnPresetImport').onclick = function () { $('filePresets').click(); };
  $('filePresets').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return; var r = new FileReader();
    r.onload = function () { try { log(P.importJSON(r.result) + ' preset(s) importado(s).', 'ok'); fillPresetSel(); } catch (x) { log('Arquivo de presets invalido.', 'err'); } };
    r.readAsText(f);
  };

  // ---------- preview em tempo real ----------
  var cv = $('cv'), g = cv.getContext('2d');
  function maxT() { var b = st.blocks[st.blocks.length - 1]; return b ? b.showEnd + 0.5 : 10; }
  function updateSeek() { var s = $('seek'); s.max = maxT(); s.value = st.t; $('tcode').textContent = U.fmt(st.t); }
  function blockAt(t) {
    for (var i = 0; i < st.blocks.length; i++) if (t >= st.blocks[i].start && t < st.blocks[i].showEnd) return i;
    return -1;
  }
  function draw() {
    if (!st.preset) return;
    var i = blockAt(st.t), b = st.blocks[i >= 0 ? i : (st.sel < st.blocks.length ? st.sel : 0)];
    var t = i >= 0 ? st.t : (b ? b.start + 0.5 : 0);
    if (!b) { g.clearRect(0, 0, cv.width, cv.height); return; }
    R.draw(g, cv.width, cv.height, b, i >= 0 ? t : Math.min(t, b.showEnd - 0.01), st.preset, { bg: st.bg, layout: layout() });
  }
  var raf = 0, last = 0;
  function tick(now) {
    if (!st.playing) return;
    st.t += (now - last) / 1000; last = now;
    if (st.t > maxT()) { st.t = 0; }
    var i = blockAt(st.t); if (i >= 0 && i !== st.sel) { st.sel = i; document.querySelectorAll('.block').forEach(function (d, k) { d.classList.toggle('sel', k === i); }); }
    updateSeek(); draw(); raf = requestAnimationFrame(tick);
  }
  function play(on) { st.playing = on; $('btnPlay').innerHTML = on ? '&#10074;&#10074;' : '&#9654;'; if (on) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  $('btnPlay').onclick = function () { play(!st.playing); };
  $('seek').oninput = function () { st.t = +this.value; $('tcode').textContent = U.fmt(st.t); draw(); };
  document.addEventListener('keydown', function (e) { if (e.code === 'Space' && !/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); play(!st.playing); } });

  // sincronismo com o playhead do Premiere
  var syncTimer = 0;
  $('syncHead').onchange = function () {
    clearInterval(syncTimer);
    if (!this.checked) return;
    syncTimer = setInterval(function () {
      if (st.playing || !st.ctx || !st.ctx.clip) return;
      host('cf_getPlayhead').then(function (r) {
        var rel = r.t - st.ctx.clip.start;
        if (Math.abs(rel - st.t) > 0.03) { st.t = Math.max(0, rel); var i = blockAt(st.t); if (i >= 0) st.sel = i; updateSeek(); draw(); }
      }).catch(function () {});
    }, 250);
  };
  $('btnFrame').onclick = function () {
    if (!HAS_NODE) return log('Requer Premiere.', 'err');
    var f = path.join(tmpDir(), 'bg_' + Date.now() + '.png');
    var rel = st.ctx && st.ctx.clip ? st.ctx.clip.start + st.t : 0;
    host('cf_exportFrame', [f, rel]).then(function () {
      var img = new Image(); img.onload = function () { st.bg = img; draw(); }; img.src = 'file:///' + f.replace(/\\/g, '/').replace(/^\//, '');
    }).catch(function (e) { log(e.message, 'err'); });
  };
  $('btnNoBg').onclick = function () { st.bg = null; draw(); };

  // ---------- aplicar na timeline ----------
  function baseTime() {
    var c = st.ctx && st.ctx.clip;
    if (settings.baseMode === 'zero') return 0;
    if (settings.baseMode === 'playhead') return st.ctx.playhead;
    return c ? c.start : 0;
  }
  $('btnApply').onclick = function () {
    if (!st.blocks.length) return log('Nao ha legendas para inserir.', 'err');
    $('btnApply').disabled = true;
    refreshCtx().then(function () {
      var base = baseTime(), mode = settings.applyMode, track = Math.max(0, settings.vTrack - 1);
      if (mode === 'srt') {
        var f = path.join(tmpDir(), 'captionflow_' + Date.now() + '.srt');
        fs.writeFileSync(f, C.toSRT(st.blocks, layout()), 'utf8');
        return host('cf_insertSrt', [f, base]).then(function () { return 'Faixa de legendas criada.'; });
      }
      if (mode === 'mogrt') {
        if (!settings.mogrtPath) throw new Error('Informe o caminho do arquivo .mogrt.');
        var items = st.blocks.map(function (b) { return { text: C.linesText(b, layout()).join('\n'), start: b.start, end: b.showEnd }; });
        return host('cf_insertMogrt', [JSON.stringify({ mogrt: settings.mogrtPath, track: track, base: base, textParam: settings.mogrtParam, items: items })])
          .then(function (r) { return r.placed + ' blocos MOGRT inseridos.' + (r.warnings.length ? '\n' + r.warnings.join('\n') : ''); });
      }
      return applyRaster(base, track);
    }).then(function (m) { $('applyStat').textContent = m; log(m, 'ok'); })
      .catch(function (e) { log(e.message, 'err'); }).then(function () { $('btnApply').disabled = false; });
  };
  function applyRaster(base, track) {
    var W = st.ctx.width, H = st.ctx.height, canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    var gc = canvas.getContext('2d'), dir = path.join(tmpDir(), 'sub_' + Date.now()), items = [], n = 0;
    fs.mkdirSync(dir, { recursive: true });
    st.blocks.forEach(function (b, bi) {
      var states = R.states(b, st.preset);
      states.forEach(function (s, si) {
        R.draw(gc, W, H, b, s.start + 0.001, st.preset, { steady: true, active: s.active, layout: layout() });
        var file = path.join(dir, 'cap_' + String(bi + 1).padStart(4, '0') + '_' + String(si + 1).padStart(2, '0') + '.png');
        fs.writeFileSync(file, Buffer.from(canvas.toDataURL('image/png').split(',')[1], 'base64'));
        var dur = s.end - s.start, first = si === 0, lastS = si === states.length - 1;
        var keys = R.keyframes(st.preset, W, H, dur, first, lastS);
        if (first && !lastS) keys = keys.filter(function (k) { return k.t <= (st.preset.anim.inDur || 0.2) + 1e-6; });
        if (lastS && !first) keys = keys.filter(function (k) { return k.t >= dur - (st.preset.anim.outDur || 0.2) - 1e-6; });
        items.push({ png: file, start: s.start, end: s.end, keys: keys }); n++;
      });
    });
    log('Inserindo ' + n + ' camadas...');
    return host('cf_insertRaster', [JSON.stringify({ track: track, base: base, items: items })]).then(function (r) {
      return r.placed + ' camadas inseridas na trilha V' + (track + 1) + (r.skipped ? ' (' + r.skipped + ' ignoradas)' : '') + '.';
    });
  }

  // ---------- inicializacao ----------
  var V = window.CF_VERSION || { version: '?', build: '' };
  $('ver').textContent = 'v' + V.version; $('ver').title = 'Build ' + V.build;
  document.title = 'CaptionFlow v' + V.version;
  st.preset = P.get(settings.presetId);
  fillPresetSel(); buildForm(); wave();
  if (!cs.isHost()) { $('ctxInfo').textContent = 'Modo navegador (sem Premiere)'; }
  refreshCtx();
  if (true) { $('btnDemo').click(); document.querySelector('#tabs [data-tab=cap]').click(); }
  window.CFApp = { state: st, setWords: setWords, draw: draw };
})();
</script>
