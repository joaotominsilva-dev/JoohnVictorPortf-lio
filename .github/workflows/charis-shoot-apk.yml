name: Charis Shoot APK

on:
  push:
    paths:
      - "charis-shoot/**"
      - ".github/workflows/charis-shoot-apk.yml"
  workflow_dispatch:

concurrency:
  group: charis-shoot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charis-shoot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar APK
        env:
          CHARIS_BUILD: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk CharisShoot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CharisShoot-apk
          path: charis-shoot/CharisShoot.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CharisShoot-apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r CharisShoot.apk
            adb shell am start -W -n com.charis.shoot/.MainActivity
            sleep 20
            adb shell screencap -p /sdcard/tela.png
            adb pull /sdcard/tela.png tela.png
            adb logcat -d -b crash > crash.txt || true
            adb shell pidof com.charis.shoot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-emulador
          path: |
            tela.png
            crash.txt

  salvar-apk:
    needs: [build, smoke-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CharisShoot-apk
          path: novo-apk
      - uses: actions/download-artifact@v4
        with:
          name: teste-emulador
          path: teste-emulador
      - name: Commit do APK e da captura
        run: |
          mkdir -p charis-shoot/apk charis-shoot/docs
          cp novo-apk/CharisShoot.apk charis-shoot/apk/CharisShoot.apk
          cp teste-emulador/tela.png charis-shoot/docs/tela-inicial.png || true
          # versao.json: o app lê este arquivo para oferecer a atualização
          build=${{ github.run_number }}
          notas=$(git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/d' | head -12)
          python3 -c 'import json,sys; print(json.dumps({"versionCode": 10+int(sys.argv[1]), "versionName": "1.2."+sys.argv[1], "apk": "CharisShoot.apk", "notas": sys.argv[2]}, ensure_ascii=False, indent=1))' "$build" "$notas" > charis-shoot/apk/versao.json
          cat charis-shoot/apk/versao.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charis-shoot/apk charis-shoot/docs
          git commit -m "Charis Shoot 1.2.${{ github.run_number }}: APK testado no emulador" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
