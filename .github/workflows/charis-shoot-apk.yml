name: Charis Shoot APK

on:
  push:
    paths:
      - "charis-shoot/**"
      - ".github/workflows/charis-shoot-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charis-shoot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk CharisShoot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CharisShoot-apk
          path: charis-shoot/CharisShoot.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CharisShoot-apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r CharisShoot.apk
            adb shell am start -W -n com.charis.shoot/.MainActivity
            sleep 20
            adb shell screencap -p /sdcard/tela.png
            adb pull /sdcard/tela.png tela.png
            adb logcat -d -b crash > crash.txt || true
            adb shell pidof com.charis.shoot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-emulador
          path: |
            tela.png
            crash.txt
